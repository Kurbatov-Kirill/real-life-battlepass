name: Deploy Symfony to SWeb

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy files via Rsync
        uses: Burnett01/rsync-deployments@v7.0.1
        with:
          switches: -avz --delete
          path: ./
          remote_path: /home/n/normvoobsh/irlbp/
          remote_host: ${{ secrets.SFTP_SERVER }}
          remote_user: ${{ secrets.SFTP_USERNAME }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
          remote_port: 22
          exclude: |
            .git/
            .github/
            .env.local
            tests/

      - name: Execute Symfony Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SFTP_SERVER }}
          username: ${{ secrets.SFTP_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /home/n/normvoobsh/irlbp/
            
            PHP_BIN=$(which php8.1 2>/dev/null || find /usr -name "php8.1" -type f -print -quit 2>/dev/null || echo "php")
            $PHP_BIN bin/console cache:clear --env=prod
            $PHP_BIN composer.phar install --no-dev --optimize-autoloader --no-interaction
